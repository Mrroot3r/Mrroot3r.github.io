<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Layout Planner - The Woman's Club of Albany</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@500;600&display=swap">
<style>
/* Layout: three working columns (furniture palette \00B7  scale plan \00B7  check & send), collapsing to one on phones.
   Look: drafting vellum and ink for the plans, ballroom-chair green as the one accent, oak for wood. */
:root {
  --wc-bg: #eef0eb;          /* vellum */
  --wc-panel: #fbfbf8;
  --wc-ink: #23272a;
  --wc-ink-2: #545a5c;
  --wc-ink-3: #848a88;
  --wc-line: #d5d8d0;
  --wc-btn-line: #aeb3a9;
  --wc-btn-shadow: rgba(35, 39, 42, 0.08);
  --wc-accent: #2e5c49;      /* the green banquet chairs */
  --wc-accent-ink: #ffffff;
  --wc-accent-soft: #dfe9e2;
  --wc-oak: #a8733d;
  --wc-ok: #3c7a4c;
  --wc-warn: #a86a12;
  --wc-warn-soft: #f6ead2;
  --wc-bad: #b0342b;
  --wc-bad-soft: #f6dcd8;
  /* plan */
  --wc-floor: #fdfcf8;
  --wc-floor-line: #e9e5d8;
  --wc-wall: #2c2b28;
  --wc-region: #e3e2dc;
  --wc-region-line: #c7c5bc;
  --wc-glass: #7aaec6;
  --wc-fixed: #6d4a33;
  --wc-fixed-line: #3f2a1d;
  --wc-hearth: #b98d74;
  --wc-fold: #ece7d9;
  --wc-fold-line: #6f6a5c;
  --wc-chair-fold: #ffffff;
  --wc-chair-green: #3f6b52;
  --wc-chair-wood: #b5803f;
  --wc-chair-wing: #8a3f3b;
  --wc-hitop: #6a372b;
  --wc-area: #c08a2c;
  --wc-walk: rgba(60, 122, 76, 0.16);
  --wc-zone: rgba(84, 90, 92, 0.10);
  --wc-door: #2e5c49;
  --wc-label: #3a3d3e;
  --wc-shadow: 0 1px 2px rgba(35, 39, 42, 0.08), 0 4px 14px rgba(35, 39, 42, 0.07);
  --wc-display: "Spectral", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --wc-sans: "Public Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --wc-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.wcap-force-light) {
    --wc-bg: #161a1b; --wc-panel: #1d2224; --wc-ink: #e7e6df; --wc-ink-2: #b4b6b0; --wc-ink-3: #868a86;
    --wc-line: #31383a; --wc-btn-line: #4d5658; --wc-btn-shadow: rgba(0, 0, 0, 0.3); --wc-accent: #6fae8d; --wc-accent-ink: #0f1a15; --wc-accent-soft: #23362d; --wc-oak: #d29a5d;
    --wc-ok: #78b98a; --wc-warn: #e2a64a; --wc-warn-soft: #3a2f1c; --wc-bad: #ec7a6d; --wc-bad-soft: #3d2320;
    --wc-floor: #232829; --wc-floor-line: #2c3233; --wc-wall: #c9c3b4; --wc-region: #1a1e1f; --wc-region-line: #353c3d;
    --wc-glass: #6fa8c4; --wc-fixed: #8c6347; --wc-fixed-line: #d7b89c; --wc-hearth: #6e5040; --wc-fold: #3a3e3c;
    --wc-fold-line: #a7a597; --wc-chair-fold: #d9d8d2; --wc-chair-green: #5d9a76; --wc-chair-wood: #c99152;
    --wc-chair-wing: #b5615b; --wc-hitop: #9a5a48; --wc-area: #d9a548; --wc-walk: rgba(111, 174, 141, 0.20);
    --wc-zone: rgba(200, 200, 190, 0.10); --wc-door: #8cc7a6; --wc-label: #d8d6cc;
    --wc-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not(.wcap-force-light) {
  --wc-bg: #161a1b; --wc-panel: #1d2224; --wc-ink: #e7e6df; --wc-ink-2: #b4b6b0; --wc-ink-3: #868a86;
  --wc-line: #31383a; --wc-btn-line: #4d5658; --wc-btn-shadow: rgba(0, 0, 0, 0.3); --wc-accent: #6fae8d; --wc-accent-ink: #0f1a15; --wc-accent-soft: #23362d; --wc-oak: #d29a5d;
  --wc-ok: #78b98a; --wc-warn: #e2a64a; --wc-warn-soft: #3a2f1c; --wc-bad: #ec7a6d; --wc-bad-soft: #3d2320;
  --wc-floor: #232829; --wc-floor-line: #2c3233; --wc-wall: #c9c3b4; --wc-region: #1a1e1f; --wc-region-line: #353c3d;
  --wc-glass: #6fa8c4; --wc-fixed: #8c6347; --wc-fixed-line: #d7b89c; --wc-hearth: #6e5040; --wc-fold: #3a3e3c;
  --wc-fold-line: #a7a597; --wc-chair-fold: #d9d8d2; --wc-chair-green: #5d9a76; --wc-chair-wood: #c99152;
  --wc-chair-wing: #b5615b; --wc-hitop: #9a5a48; --wc-area: #d9a548; --wc-walk: rgba(111, 174, 141, 0.20);
  --wc-zone: rgba(200, 200, 190, 0.10); --wc-door: #8cc7a6; --wc-label: #d8d6cc;
  --wc-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

/* ---------- shell (everything scoped so the website theme can't reach in) ---------- */
.wcap, .wcap * { box-sizing: border-box; }
.wcap [hidden] { display: none !important; }
.wcap {
  container-type: inline-size;
  font-family: var(--wc-sans); font-size: 14px; line-height: 1.45; color: var(--wc-ink);
  background: var(--wc-bg); border-radius: 10px; padding: 18px; text-align: left;
  -webkit-font-smoothing: antialiased; outline: none; position: relative;
}
:where(.wcap) :where(h2, h3, h4, p) { margin: 0; padding: 0; font-weight: inherit; color: inherit; background: none; border: 0; }
:where(.wcap) :where(button, input, select, textarea) {
  font: inherit; color: inherit; margin: 0; letter-spacing: normal; text-transform: none; box-shadow: none;
}
:where(.wcap) :where(button) { cursor: pointer; background: none; border: 0; padding: 0; line-height: 1.2; min-height: 0; width: auto; height: auto; }
.wcap :focus-visible { outline: 2px solid var(--wc-accent); outline-offset: 2px; }
.wcap svg { display: block; overflow: visible; max-width: none; }

/* ---------- header ---------- */
.wcap-head { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; padding: 2px 2px 16px; }
.wcap-eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--wc-ink-3); font-weight: 600; }
.wcap-head h2 { font-family: var(--wc-display); font-size: 30px; line-height: 1.1; font-weight: 600; margin-top: 4px; text-wrap: balance; }
.wcap-lede { color: var(--wc-ink-2); max-width: 62ch; margin-top: 6px; }
.wcap-seg { display: inline-flex; border: 1px solid var(--wc-line); border-radius: 8px; background: var(--wc-panel); padding: 3px; gap: 2px; }
.wcap-seg button { padding: 7px 12px; border-radius: 6px; color: var(--wc-ink-2); font-weight: 500; white-space: nowrap; }
.wcap-seg button[aria-pressed="true"] { background: var(--wc-accent); color: var(--wc-accent-ink); }
.wcap-rental { display: grid; gap: 5px; }
.wcap-label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--wc-ink-3); font-weight: 600; }

/* ---------- body grid ---------- */
.wcap-body { display: grid; grid-template-columns: 212px minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.wcap-card { background: var(--wc-panel); border: 1px solid var(--wc-line); border-radius: 10px; }

/* palette */
.wcap-palette { padding: 10px; display: grid; gap: 10px; position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; overscroll-behavior: contain; align-content: start; }
.wcap-pgroup { display: grid; gap: 3px; }
.wcap-pgroup > .wcap-label { padding: 0 4px 2px; }
.wcap-pitem {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%;
  padding: 4px 6px; border-radius: 7px; text-align: left; border: 1px solid var(--wc-line); background: var(--wc-panel);
}
.wcap-pitem:hover:not(:disabled) { background: var(--wc-accent-soft); border-color: var(--wc-accent); }
.wcap-pitem[aria-pressed="true"] { background: var(--wc-accent-soft); border-color: var(--wc-accent); box-shadow: inset 3px 0 0 var(--wc-accent); }
.wcap-pitem:disabled { opacity: .45; cursor: not-allowed; }
.wcap-pitem svg { width: 30px; height: 22px; }
.wcap-pname { font-weight: 600; font-size: 13px; display: block; line-height: 1.2; }
.wcap-psub { font-size: 11.5px; color: var(--wc-ink-3); display: block; line-height: 1.2; }
.wcap-pcount { font-family: var(--wc-mono); font-size: 11.5px; color: var(--wc-ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wcap-pcount.is-out { color: var(--wc-bad); }
.wcap-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; padding: 7px; border-radius: 8px; background: var(--wc-bg); margin-top: 3px; }
.wcap-rows .wcap-in { min-height: 28px; padding: 3px 6px; }
.wcap-rows select.wcap-in { font-size: 12.5px; padding-right: 2px; }
.wcap-rows label { font-size: 12px; color: var(--wc-ink-2); display: grid; gap: 2px; }
.wcap-rows .wcap-btn { grid-column: 1 / -1; white-space: normal; text-align: center; }
.wcap-tip { font-size: 12px; color: var(--wc-ink-3); padding: 0 4px; }

/* inputs + buttons */
.wcap-in {
  width: 100%; border: 1px solid var(--wc-line); background: var(--wc-panel); border-radius: 6px; padding: 6px 8px; min-height: 32px;
}
.wcap textarea.wcap-in { min-height: 64px; resize: vertical; line-height: 1.4; }
.wcap-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border-radius: 7px;
  border: 1px solid var(--wc-btn-line); background: var(--wc-panel); font-weight: 600; font-size: 13px; white-space: nowrap;
  box-shadow: 0 1px 0 var(--wc-btn-shadow); color: var(--wc-ink);
}
.wcap a.wcap-btn { text-decoration: none; color: inherit; }
.wcap a.wcap-btn.is-primary { color: var(--wc-accent-ink); }
.wcap-btn:hover:not(:disabled) { border-color: var(--wc-accent); background: var(--wc-accent-soft); }
.wcap-btn[aria-pressed="true"] { background: var(--wc-accent); color: var(--wc-accent-ink); border-color: var(--wc-accent); box-shadow: 0 0 0 3px var(--wc-accent-soft); }
.wcap-btn[aria-pressed="true"]:hover { background: var(--wc-accent); filter: brightness(1.08); }
.wcap-btn:disabled { opacity: .45; cursor: not-allowed; }
.wcap-btn.is-primary { background: var(--wc-accent); color: var(--wc-accent-ink); border-color: var(--wc-accent); }
.wcap-btn.is-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--wc-accent); }
.wcap-btn.is-quiet { border-color: transparent; background: transparent; color: var(--wc-ink-2); box-shadow: none; }
.wcap-btn.is-danger { color: var(--wc-bad); }
.wcap-icon { width: 16px; height: 16px; flex: none; }

/* stage */
.wcap-stage { display: grid; gap: 8px; min-width: 0; }
.wcap-stagebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.wcap-tabs { display: inline-flex; gap: 4px; }
.wcap-tab {
  padding: 8px 14px; border-radius: 8px 8px 0 0; font-weight: 600; color: var(--wc-ink-2); border: 1px solid transparent;
  border-bottom: 2px solid transparent; display: inline-flex; gap: 8px; align-items: baseline;
}
.wcap-tab[aria-selected="true"] { color: var(--wc-ink); border-bottom-color: var(--wc-accent); }
.wcap-tab small { font-family: var(--wc-mono); font-weight: 400; color: var(--wc-ink-3); font-size: 11.5px; }
.wcap-tab:disabled { opacity: .5; cursor: not-allowed; }
.wcap-tools { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.wcap-tool { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--wc-ink-2); border: 1px solid var(--wc-line); background: var(--wc-panel); }
.wcap-tool:hover:not(:disabled) { color: var(--wc-ink); border-color: var(--wc-ink-3); }
.wcap-tool:disabled { opacity: .4; cursor: not-allowed; }
.wcap-tool[aria-pressed="true"] { background: var(--wc-accent-soft); color: var(--wc-accent); border-color: var(--wc-accent); }
.wcap-sep { width: 1px; height: 22px; background: var(--wc-line); margin: 0 4px; }
.wcap-canvas {
  position: relative; overflow: auto; border-radius: 10px; border: 1px solid var(--wc-line); background: var(--wc-floor);
  max-height: 78vh; -webkit-overflow-scrolling: touch;
}
.wcap-svg { margin: 0 auto; height: auto; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; cursor: default; }
.wcap-svg.is-placing { cursor: crosshair; }
.wcap-svg.is-placing { touch-action: none; }
.wcap-svg #wcap-l-over * { pointer-events: none; }
.wcap-svg #wcap-l-over [data-handle] { pointer-events: all; }
.wcap-svg [data-id] { cursor: grab; touch-action: none; }
.wcap-svg [data-fixed] { cursor: pointer; }
.wcap-svg [data-rail] { cursor: ns-resize; touch-action: none; }
.wcap-svg.is-placing [data-id], .wcap-svg.is-placing [data-fixed] { cursor: crosshair; }
.wcap-status { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; color: var(--wc-ink-2); font-size: 13px; padding: 0 2px; }
.wcap-hint { min-height: 1.4em; }
.wcap-hint kbd { font-family: var(--wc-mono); font-size: 11px; border: 1px solid var(--wc-line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--wc-panel); }
.wcap-stats { font-family: var(--wc-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--wc-ink-3); }
.wcap-floornote { font-size: 12px; color: var(--wc-ink-3); padding: 0 2px; }

/* selection toolbar */
.wcap-seltools {
  position: absolute; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; max-width: min(460px, 94%);
  background: var(--wc-panel); border: 1px solid var(--wc-line); border-radius: 9px; padding: 5px; box-shadow: var(--wc-shadow);
}
.wcap-seltools .wcap-btn { padding: 6px 9px; font-size: 12.5px; }
.wcap-seltools .wcap-in { width: 120px; min-height: 30px; padding: 4px 7px; font-size: 12.5px; }
.wcap-seltools .wcap-in.is-num { width: 62px; font-family: var(--wc-mono); }
.wcap-seltitle { font-weight: 600; font-size: 12.5px; padding: 0 6px 0 4px; color: var(--wc-ink-2); }
.wcap-selsep { width: 1px; align-self: stretch; background: var(--wc-line); margin: 2px 2px; }

/* side */
.wcap-side { display: grid; gap: 12px; min-width: 0; }
.wcap-sec { padding: 14px; display: grid; gap: 10px; min-width: 0; }
.wcap-sec h3 { font-family: var(--wc-display); font-size: 19px; font-weight: 600; line-height: 1.2; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.wcap-pill { font-family: var(--wc-sans); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.wcap-pill.is-ok { background: var(--wc-accent-soft); color: var(--wc-ok); }
.wcap-pill.is-warn { background: var(--wc-warn-soft); color: var(--wc-warn); }
.wcap-pill.is-bad { background: var(--wc-bad-soft); color: var(--wc-bad); }
.wcap-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.wcap-checks li { margin: 0; padding: 0; list-style: none; }
.wcap-checks li::before { content: none; }
.wcap-check {
  width: 100%; text-align: left; display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 9px; align-items: start;
  padding: 7px 9px; border-radius: 7px; background: var(--wc-bg); font-size: 13px; line-height: 1.4;
}
.wcap-check::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--wc-warn); }
.wcap-check.is-bad::before { background: var(--wc-bad); }
.wcap-check.is-info::before { background: var(--wc-ink-3); }
.wcap-check b { font-weight: 600; }
.wcap-check:hover { outline: 1px solid var(--wc-line); }
.wcap-empty { color: var(--wc-ink-3); font-size: 13px; }
.wcap-setup { font-family: var(--wc-mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; background: var(--wc-bg); border-radius: 7px; padding: 10px; max-height: 280px; overflow: auto; margin: 0; color: var(--wc-ink); }
.wcap details > summary { cursor: pointer; list-style: none; }
.wcap details > summary::-webkit-details-marker { display: none; }
.wcap-sum { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wcap-sum::after { content: "Show"; font-family: var(--wc-sans); font-size: 12px; font-weight: 600; color: var(--wc-ink); border: 1px solid var(--wc-btn-line); border-radius: 6px; padding: 3px 9px; box-shadow: 0 1px 0 var(--wc-btn-shadow); }
.wcap details[open] > .wcap-sum::after { content: "Hide"; }
.wcap-sum:hover::after { border-color: var(--wc-accent); background: var(--wc-accent-soft); }
.wcap-notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.wcap-notes li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; margin: 0; padding: 0; list-style: none; }
.wcap-notes li::before { content: none; }
.wcap-pin { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--wc-area); color: #fff; font-weight: 700; font-size: 12px; font-family: var(--wc-sans); }
.wcap-notes .wcap-in { min-height: 52px; }
.wcap-where { font-size: 11.5px; color: var(--wc-ink-3); }
.wcap-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.wcap-form label { display: grid; gap: 3px; font-size: 12.5px; color: var(--wc-ink-2); font-weight: 500; min-width: 0; }
.wcap-form .is-wide { grid-column: 1 / -1; }
.wcap-req { color: var(--wc-bad); }
.wcap-goes { font-size: 12.5px; color: var(--wc-ink-2); }
.wcap-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.wcap-small { font-size: 12.5px; color: var(--wc-ink-3); }
.wcap-saved { display: grid; gap: 6px; border-top: 1px solid var(--wc-line); padding-top: 10px; }
.wcap-savedlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.wcap-savedlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; margin: 0; padding: 0; list-style: none; }
.wcap-savedlist li::before { content: none; }
.wcap-savedlist li.wcap-empty { display: block; }
.wcap-savedlist .wcap-btn { padding: 5px 9px; font-size: 12.5px; }
.wcap-savedname { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wcap-banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--wc-accent-soft); color: var(--wc-ink); border-radius: 9px; padding: 9px 12px; margin-bottom: 12px; font-size: 13.5px; }

/* modal + toast */
.wcap-modal { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); background: rgba(20, 24, 26, .48); }
.wcap-dialog { background: var(--wc-panel); color: var(--wc-ink); border-radius: 12px; width: min(760px, 100%); max-height: 88vh; overflow: auto; padding: 18px; display: grid; gap: 12px; box-shadow: var(--wc-shadow); font-family: var(--wc-sans); font-size: 14px; }
.wcap-dialog h3 { font-family: var(--wc-display); font-size: 22px; font-weight: 600; }
.wcap-dialog img { max-width: 100%; border: 1px solid var(--wc-line); border-radius: 8px; display: block; }
.wcap-dialog pre { font-family: var(--wc-mono); font-size: 12px; white-space: pre-wrap; background: var(--wc-bg); padding: 10px; border-radius: 8px; margin: 0; max-height: 260px; overflow: auto; }
.wcap-copyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wcap-copyrow code { font-family: var(--wc-mono); font-size: 12.5px; background: var(--wc-bg); padding: 3px 7px; border-radius: 5px; user-select: all; word-break: break-all; }
.wcap-toast {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 6; max-width: min(520px, 92%);
  background: var(--wc-ink); color: var(--wc-panel); padding: 9px 14px; border-radius: 8px; font-size: 13.5px; box-shadow: var(--wc-shadow);
  pointer-events: none;
}

/* print sheet (only visible when printing) */
.wcap-print { display: none; }
@media print {
  html.wcap-printing body * { visibility: hidden !important; }
  html.wcap-printing .wcap-print, html.wcap-printing .wcap-print * { visibility: visible !important; }
  html.wcap-printing .wcap-print { display: block !important; position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; font-family: Georgia, serif; }

@container (max-width: 1120px) {

      if (b.hasAttribute('data-delnote')) { pushHistory(); var nid = b.getAttribute('data-delnote'); state.items = state.items.filter(function (i) { return i.id !== nid; }); changed(); return; }
      if (b.hasAttribute('data-copy-full')) copy($('#wcap-mailbody').textContent); // and then the link opens the mail program as usual
      if (b.hasAttribute('data-copy')) { copy($('#wcap-mailbody').textContent, b); return; }
      if (b.hasAttribute('data-copy-img')) { copyPicture(b); return; }
      if (b.hasAttribute('data-share-img')) { sharePicture(b); return; }
      if (b.hasAttribute('data-copy-text')) { copy(b.getAttribute('data-copy-text'), b); return; }
      var act = b.getAttribute('data-act');
      if (!act) return;
      if (act === 'select') setTool(null);
      else if (act === 'undo') undo(); else if (act === 'redo') redo();
      else if (act === 'walk') { view.showWalk = !view.showWalk; b.setAttribute('aria-pressed', String(view.showWalk)); renderWalk(); }
      else if (act === 'look') { view.look = view.look === 'real' ? 'drawn' : 'real'; b.setAttribute('aria-pressed', String(view.look === 'real')); try { localStorage.setItem('wca-layout-planner-look', view.look); } catch (e) { } staticKey = ''; render(); }
      else if (act === 'outlets') { view.showOutlets = !view.showOutlets; b.setAttribute('aria-pressed', String(view.showOutlets)); staticKey = ''; render(); }
      else if (act === 'zoomin') zoomBy(1.35); else if (act === 'zoomout') zoomBy(1 / 1.35); else if (act === 'zoomfit') zoomBy(0);
      else if (act === 'picture') showPictures();
      else if (act === 'print') printSheet();
      else if (act === 'close-modal') closeModal();
      else if (act === 'close-banner') $('#wcap-banner').hidden = true;
      else if (act === 'reset-house' || act === 'reset-example') { pushHistory(); resetTo(act === 'reset-example' ? 'example' : 'house'); view.sel = []; staticKey = ''; changed(); fillForm(); toast(act === 'reset-example' ? 'Loaded the example event. Undo goes back to your plan.' : 'Back to the usual first-floor setup. Undo goes back to your plan.'); }
      else if (act === 'clear-floor') { pushHistory(); state.items = state.items.filter(function (i) { return i.f !== view.floor || i.t === 'piano'; }); view.sel = []; changed(); toast('Cleared the ' + GEO[view.floor].name.toLowerCase() + '. Undo brings it back.'); }
      else if (act === 'plan-link') {
        encodePlan().then(function (code) {
          var link = planLink(code);
          openModal('<h3>Link to this plan</h3><p>This is the same link the committee gets in the email. Opening it on the website shows this exact layout. To try it here, copy it, close this box, and paste it into <b>Plan link or code</b>, then press Open.</p>' +
            '<div class="wcap-copyrow"><button type="button" class="wcap-btn" data-copy-text="' + esc(link) + '">' + icon('copy') + ' Copy link</button></div><pre style="user-select:all;word-break:break-all;white-space:pre-wrap">' + esc(link) + '</pre>' +
            '<div class="wcap-actions"><button type="button" class="wcap-btn" data-act="close-modal">Close</button></div>');
        });
      }
      else if (act === 'save-plan') savePlanAs($('#wcap-save-name').value);
      else if (act === 'open-code') { decodePlan($('#wcap-code').value).then(function (o) { loadPlanObject(o, 'Opened a plan'); $('#wcap-code').value = ''; }).catch(function () { toast('That doesn\u2019t look like a plan link or code. Copy the whole link from the email.'); }); }
    });
    $('#wcap-save-name').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); savePlanAs(e.target.value); } });
    $('#wcap-seltools').addEventListener('click', onSeltool);
    $('#wcap-seltools').addEventListener('input', onSelInput);
    $('#wcap-seltools').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    $('#wcap-seltools').addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter' && e.target.id === 'wcap-sel-label') { e.target.blur(); changed(); } });
    $('#wcap-seltools').addEventListener('change', function (e) { if (e.target.id === 'wcap-sel-label' || e.target.id === 'wcap-sel-w' || e.target.id === 'wcap-sel-h') { saveDraft(); runAnalysis(); renderSetup(); } });
    $('#wcap-notes').addEventListener('input', function (e) { var id = e.target.getAttribute('data-note'); if (!id) return; var it = byId(id); if (it) { it.text = e.target.value; saveDraft(); clearTimeout(analyzeTimer); analyzeTimer = setTimeout(renderSetup, 300); } });
    $('#wcap-general').addEventListener('input', function (e) { state.general = e.target.value; saveDraft(); clearTimeout(analyzeTimer); analyzeTimer = setTimeout(renderSetup, 300); });
    $('#wcap-form').addEventListener('input', function () { readForm(); saveDraft(); clearTimeout(analyzeTimer); analyzeTimer = setTimeout(runAnalysis, 400); });
    $('#wcap-form').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    $('#wcap-modal').addEventListener('click', function (e) { if (e.target.id === 'wcap-modal') closeModal(); });
    ['wcap-pat-t', 'wcap-pat-p', 'wcap-pat-r', 'wcap-pat-c', 'wcap-pat-g'].forEach(function (id) { $('#' + id).addEventListener('change', function () { readPatCfg(); renderHint(); if (view.tool === 'pattern' && hoverPt) updateGhost(hoverPt); }); });
    ['wcap-rows-n', 'wcap-rows-s', 'wcap-rows-a'].forEach(function (id) { $('#' + id).addEventListener('change', function () { view.rowsCfg.rows = clamp(+$('#wcap-rows-n').value || 4, 1, 12); view.rowsCfg.seats = clamp(+$('#wcap-rows-s').value || 8, 1, 20); view.rowsCfg.aisle = +$('#wcap-rows-a').value; if (view.tool === 'rows' && hoverPt) updateGhost(hoverPt); }); });

    ROOT.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (e.key === 'Escape') { if (!$('#wcap-modal').hidden) return closeModal(); if (drag) return cancelDrag(); if (view.tool) setTool(null); else { view.sel = []; renderSelection(); renderHint(); } return; }
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      var mod = e.ctrlKey || e.metaKey;
      if (mod && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
      if (mod && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); return; }
      if (mod && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); duplicateSelection(); return; }
      if (e.key === 'r' || e.key === 'R') { e.preventDefault(); if (drag && drag.move) { rotateWhileDragging(e.shiftKey ? -45 : 45); return; } if (view.tool) { view.ghostRot = normAng(view.ghostRot + (e.shiftKey ? -45 : 45)); if (hoverPt) updateGhost(hoverPt); } else rotateSelection(e.shiftKey ? -45 : 45); return; }
      if (e.key === 'Delete' || e.key === 'Backspace') { if (view.sel.length) { e.preventDefault(); deleteSelection(); } return; }
      var arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
      if (arrows[e.key] && view.sel.length) { e.preventDefault(); nudge(arrows[e.key][0] * (e.shiftKey ? 6 : 1), arrows[e.key][1] * (e.shiftKey ? 6 : 1)); }
    });
  }
  function nudge(dx, dy) {
    var g0 = view.sel.length === 1 && view.sel[0].indexOf('fx:') === 0 ? fixedById(view.sel[0]) : null;
    if (g0 && g0.rail) { if (!dy) return toast('This table only slides forward and back.'); var bf = snapshot(), was = offOf(g0); slideTo(g0, was + dy); finishRail(g0, bf, offOf(g0) !== was); if (offOf(g0) === was) toast('It can\u2019t slide any farther that way.'); return; }
    var its = selectionItems(); if (!its.length) return;
    var set = movingSet(its.map(function (i) { return i.id; })), before = snapshot();
    set.forEach(function (id) { var it = byId(id); it.x = r1(it.x + dx); it.y = r1(it.y + dy); if (it.a && !set.has(it.a.p)) delete it.a; });
    var bad = groupWhy(set);
    if (bad) { restore(before); view.sel = its.map(function (i) { return i.id; }); renderItems(); return toast(bad); }
    pushUndo(before); changed();
  }

  /* ================================================================
     Start
     ================================================================ */
  ROOT.tabIndex = -1;
  buildShell();
  bind();
  var draft = loadDraft();
  if (draft) adoptPlan(draft);
  else resetTo(CFG.startWith === 'example' ? 'example' : CFG.startWith === 'blank' ? 'blank' : 'house');
  fillForm(); renderGoes(); renderSaved();
  if (view.floor === 'ballroom' && state.rental === 'first') view.floor = 'first';
  render(); runAnalysis(); preloadImages();
  var hm = (location.hash || '').match(/wcaplan=([A-Za-z0-9_-]+)/);
  if (hm) decodePlan(hm[1]).then(function (o) { loadPlanObject(o, 'Submitted plan'); }).catch(function () { toast('The plan link in the address bar couldn\u2019t be read.'); });
  function audit() { // self-check used by the tests: every rule the planner promises, checked on the plan as it stands
    var bad = [], ids = {};
    state.items.forEach(function (it) {
      var tag = it.id + ' ' + it.t + ' @' + it.x + ',' + it.y + ' r' + it.r + (it.a ? ' at ' + it.a.p + '#' + it.a.s : '');
      if (ids[it.id]) bad.push('two pieces share an id: ' + tag); ids[it.id] = 1;
      if (!/^i\d+$/.test(it.id)) bad.push('odd id: ' + tag);
      if (!isFinite(it.x) || !isFinite(it.y) || !isFinite(it.r)) bad.push('not a number: ' + tag);
      if (+it.id.slice(1) >= state.seq) bad.push('id ahead of the counter: ' + tag);
      var ck = checkPlace(it); if (!ck.ok) bad.push(tag + ': ' + ck.why);
      if (it.a) {
        var sl = slotsFor(it.a.p)[it.a.s];
        if (!sl) bad.push('seat does not exist: ' + tag);
        else { var ps = chairAtSlot(it.t, sl); if (Math.hypot(ps.x - it.x, ps.y - it.y) > 0.5) bad.push('chair is not at its seat: ' + tag); }
      }
    });
    Object.keys(CFG.inventory).forEach(function (t) { if (left(t) < 0) bad.push('more ' + t + ' than the club owns'); });
    if (used('piano') !== 1) bad.push('pianos: ' + used('piano'));
    return bad;
  }
  ROOT._wcap = { audit: audit, undo: undo, redo: redo, stacks: function () { return [undoStack.length, redoStack.length]; }, state: function () { return state; }, analyze: analyze, encode: encodePlan, decode: decodePlan, setFloor: setFloor, setTool: setTool, slotsFor: slotsFor, exportSVG: exportSVG, check: checkPlace, patternPoses: function (cfg, box) { cfg.ct = cfg.ct || defaultChair(view.floor); return patternPoses(cfg, box); }, left: left, geo: GEO, fixedPoly: fixedPoly, fixed: FIXED };
})();
